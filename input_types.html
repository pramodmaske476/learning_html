<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>All input types in HTML</h2>

    <form>
        <label>FIRST NAME</label>
        <input type="text" placeholder="ENTER NAME ">
        <br> <br>

        <label>LAST NAME</label>
        <input type="text" placeholder="ENTER LAST NAME">
        <br> <br>

        <label >EMAIL</label>
        <input type="text " placeholder="ENTER EMAIL">
        <br> <br>

        <label>FAX NUMBER</label>
        <input type="number" placeholder="FAX NUMBER">
        <br> <br>
         

        <label>DOB</label>
        <input type="date" >

        <label >select month</label>
        <input type="month">
        
        
        <label >select month</label>
        <input type="month">

        <label >select time</label>
        <input type="time">

        <label >date and time </label>
        <input type="datetime-local">
        <br><br>

        <label >choose city</label>
        <input type="checkbox" >MUMBAI
        <input type="checkbox">PUNE
        <input type="checkbox">BEED
        <input type="checkbox">JALNA
        <br><br>

        <label >GENDER</label>
        <input type="radio" name="GENDER"> MALE
        <input type="radio" name="GENDER"> FEMALE
        <input type="radio" name="GENDER"> OTHERS
        <br><br>

        <label >select color</label>
        <input type="color">

        <label >select range</label>
        <input type="range">

        <label >upload doc</label>
        <input type="file" multiple>

        <br>

        <label >enter password</label>
        <input type="password">

        <label >url </label>
        <input type="url" placeholder="https://example.com">

        <label >search</label>
        <input type="search" placeholder="enter to search">

        <label >phone number</label>
        <input type="tel" placeholder="enter phone number ">

        <label>select country </label>
        <select>
            <option >choose</option>
            <option>india</option>
            <option >uk</option>
            <option >us</option>
            <option >shrilanka</option>
        </select>
        <br><br>

        <label>address</label> <br>
        <textarea rows="5" cols="30"></textarea>
        <br>

        <input type="submit" value="submit">
        <input type="button" value="submit">
        <input type="reset" value="reset">
        <br>

    </form>
</body>
</html>
